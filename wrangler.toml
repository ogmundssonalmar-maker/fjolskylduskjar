name = "fjolskylduskjar"
main = "src/worker.js"
compatibility_date = "2026-11-18"
keep_vars = true

[vars]
WEEKLY_MENU_AUTOMATION_ENABLED = "false"
OPENAI_MENU_MODEL = "gpt-5.4-mini"
GOOGLE_CALENDAR_WRITES_ENABLED = "true"
ACCESS_TEAM_DOMAIN = "shy-snow-47c2.cloudflareaccess.com"
ACCESS_AUDIENCES = "fdea7ce218685eec60b396c8f0de04f7d117816543e15be50efcecd6710b7e03"

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "fjolskylduskjar-db"
database_id = "d935b166-0b01-450c-bed0-e3fa1efb51dc"

[build]
command = "npm run build"

